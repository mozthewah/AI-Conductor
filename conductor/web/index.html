<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conductor</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#146b6b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Conductor">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23146b6b'/><path d='M9 23 L23 9' stroke='white' stroke-width='3' stroke-linecap='round'/><circle cx='9' cy='23' r='3.2' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>try { var t = JSON.parse(localStorage.getItem("conductor.prefs") || "{}").theme; if (t && t !== "system") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
  <script src="/static/vendor/marked.min.js" defer></script>
  <script src="/static/vendor/purify.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <button class="icon-btn sidebar-close" id="sidebarClose" type="button" title="Close menu" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <a class="brand" href="/" data-nav="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 23 L23 9"/><circle cx="9" cy="23" r="3.2"/></svg>
        <span>Conductor</span>
      </a>
      <button class="new-task" data-nav="/">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New task
      </button>
      <div class="task-list" id="taskList"></div>
      <nav class="side-nav">
        <a data-nav="/memory"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.2 4.6.6.6.8 1.2.8 2V17h6v-1.4c0-.8.2-1.4.8-2 1-1 2.2-2.4 2.2-4.6a6 6 0 0 0-6-6zM10 20h4"/></svg>Memory</a>
        <a data-nav="/skills"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h12"/></svg>Skills</a>
        <a data-nav="/models"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5zM3 13l9 5 9-5M3 17.5 12 22l9-4.5"/></svg>Models</a>
        <a data-nav="/safety"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>Safety</a>
        <a data-nav="/schedules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedules</a>
        <a data-nav="/audit"><svg viewBox="0 0 24 24"><path d="M9 5h10M9 12h10M9 19h10M4.5 5h.01M4.5 12h.01M4.5 19h.01"/></svg>Audit log</a>
        <a data-nav="/files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files</a>
      </nav>
      <a class="credit-pill" id="creditPill" href="https://openrouter.ai/settings/credits" target="_blank" rel="noopener" hidden></a>
      <div class="model-chip" id="modelChip"></div>
      <button class="theme-btn" id="themeBtn" type="button"></button>
      <button class="theme-btn" id="updateBtn" type="button" title="Pull the latest Conductor from git and restart"></button>
    </aside>
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <main id="main"></main>
  </div>
</body>
</html>
