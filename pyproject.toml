[project]
name = "ai-conductor"
version = "0.1.0"
description = "A self-hosted AI conductor: plans, browses, runs code, delegates to sub-agents, remembers you, and learns reusable skills."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
conductor = "conductor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.setuptools.package-data]
conductor = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"
